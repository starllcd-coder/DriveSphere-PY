upstream drivesphere_app {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location /static/ {
        alias /vol/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /vol/media/;
        access_log off;
        expires 7d;
    }

    location /healthz/ {
        proxy_pass http://drivesphere_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://drivesphere_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
